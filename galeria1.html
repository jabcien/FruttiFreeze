<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FruttiFrezze | Galería</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/navbar.css">
    <link rel="stylesheet" href="css/footer.css">
    <style>
        .gallery-item {
            position: relative;
            overflow: hidden;
            border-radius: 15px;
            margin-bottom: 30px;
            cursor: pointer;
        }
        .gallery-item img {
            width: 100%;
            height: 300px;
            object-fit: cover;
            transition: transform 0.5s ease;
        }
        .gallery-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(255, 107, 107, 0.8);
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: opacity 0.3s ease;
            color: #fff;
            font-size: 1.5rem;
        }
        .gallery-item:hover img {
            transform: scale(1.1);
        }
        .gallery-item:hover .gallery-overlay {
            opacity: 1;
        }
    </style>
</head>
<body>

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg fixed-top bg-white shadow-sm">
        <div class="container">
            <a class="navbar-brand" href="index.html">
                <img src="img/logo.png" alt="Logo" class="navbar-logo">FruttiFrezze
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Inicio</a></li>
                    <li class="nav-item"><a class="nav-link" href="nosotros.html">Nosotros</a></li>
                    <li class="nav-item"><a class="nav-link" href="productos.html">Productos</a></li>
                    <li class="nav-item"><a class="nav-link" href="servicios.html">Servicios</a></li>
                    <li class="nav-item"><a class="nav-link active" href="galeria.html">Galería</a></li>
                    <li class="nav-item"><a class="nav-link" href="contacto.html">Contacto</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <section class="mt-5">
        <div class="container">
            <div class="section-title">
                <h2>Nuestra Galería</h2>
                <p class="text-muted">Momentos dulces y refrescantes capturados para ti</p>
            </div>

            <!-- Gallery Filter -->
            <div class="row mb-4">
                <div class="col-12 text-center">
                    <button class="btn btn-outline-primary m-1 active">Todos</button>
                    <button class="btn btn-outline-primary m-1">Local</button>
                    <button class="btn btn-outline-primary m-1">Preparación</button>
                    <button class="btn btn-outline-primary m-1">Clientes</button>
                </div>
            </div>

            <!-- Gallery Grid -->
            <div class="row">
                <div class="col-md-4 col-sm-6">
                    <div class="gallery-item" data-bs-toggle="modal" data-bs-target="#lightboxModal">
                        <img src="img/galeria/img1.jpg" alt="Galería 1">
                        <div class="gallery-overlay"><i class="fas fa-search-plus"></i></div>
                    </div>
                </div>
                <div class="col-md-4 col-sm-6">
                    <div class="gallery-item" data-bs-toggle="modal" data-bs-target="#lightboxModal">
                        <img src="img/galeria/img2.jpg" alt="Galería 2">
                        <div class="gallery-overlay"><i class="fas fa-search-plus"></i></div>
                    </div>
                </div>
                <div class="col-md-4 col-sm-6">
                    <div class="gallery-item" data-bs-toggle="modal" data-bs-target="#lightboxModal">
                        <img src="img/galeria/img3.jpg" alt="Galería 3">
                        <div class="gallery-overlay"><i class="fas fa-search-plus"></i></div>
                    </div>
                </div>
                <div class="col-md-4 col-sm-6">
                    <div class="gallery-item" data-bs-toggle="modal" data-bs-target="#lightboxModal">
                        <img src="img/galeria/img4.jpg" alt="Galería 4">
                        <div class="gallery-overlay"><i class="fas fa-search-plus"></i></div>
                    </div>
                </div>
                <div class="col-md-4 col-sm-6">
                    <div class="gallery-item" data-bs-toggle="modal" data-bs-target="#lightboxModal">
                        <img src="img/galeria/img5.jpg" alt="Galería 5">
                        <div class="gallery-overlay"><i class="fas fa-search-plus"></i></div>
                    </div>
                </div>
                <div class="col-md-4 col-sm-6">
                    <div class="gallery-item" data-bs-toggle="modal" data-bs-target="#lightboxModal">
                        <img src="img/galeria/img6.jpg" alt="Galería 6">
                        <div class="gallery-overlay"><i class="fas fa-search-plus"></i></div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Lightbox Modal -->
    <div class="modal fade" id="lightboxModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered modal-lg">
            <div class="modal-content bg-transparent border-0">
                <div class="modal-body p-0 text-center">
                    <button type="button" class="btn-close btn-close-white position-absolute top-0 end-0 m-3" data-bs-dismiss="modal" aria-label="Close"></button>
                    <img src="img/galeria/img1.jpg" class="img-fluid rounded" id="lightboxImg">
                </div>
            </div>
        </div>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="container text-center">
            <p class="mb-0">&copy; 2026 FruttiFrezze. Todos los derechos reservados.</p>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/main.js"></script>
    <script>
        // Simple Lightbox Logic
        document.querySelectorAll('.gallery-item').forEach(item => {
            item.addEventListener('click', function() {
                const imgSrc = this.querySelector('img').src;
                document.getElementById('lightboxImg').src = imgSrc;
            });
        });
    </script>
</body>
</html>
